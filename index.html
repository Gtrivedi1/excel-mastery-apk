<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14201a;--mut:#5d6b63;--line:#d5ddd8;--g:#1f7a4d;--gs:#dff1e7;--sel:#fff1a8;--bad:#b3261e;--fx:#2457c5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#17221c;--ink:#e8f0eb;--mut:#92a399;--line:#2b3b32;--g:#46c283;--gs:#1d3a2b;--sel:#5a4d12;--bad:#ff8a80;--fx:#8fb2ff}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17221c;--ink:#e8f0eb;--mut:#92a399;--line:#2b3b32;--g:#46c283;--gs:#1d3a2b;--sel:#5a4d12;--bad:#ff8a80;--fx:#8fb2ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Instrument Sans',system-ui,sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}h2{font-size:20px;margin:0 0 6px}h3{font-size:16px;margin:18px 0 8px}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.ch .ic{width:42px;height:42px;border-radius:6px;background:var(--gs);color:var(--g);display:grid;place-items:center;font:700 17px 'JetBrains Mono',monospace;flex:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}
.hero{background:var(--g);color:#fff;border-radius:12px;padding:16px;margin:8px 0 14px}.hero .mut{color:#d6f0e2}
.fn{border-left:3px solid var(--g);padding:2px 0 2px 10px;margin:10px 0}.fn b{font-family:'JetBrains Mono',monospace;font-size:14px}
.syn{display:block;color:var(--fx);margin:2px 0;overflow-x:auto;white-space:nowrap}
.tip{background:var(--gs);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.sheet{overflow-x:auto;border:1px solid var(--line);border-radius:6px;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:5px 9px;white-space:nowrap;text-align:left}
th{background:var(--gs);color:var(--g);font-weight:600;text-align:center;font-size:12px}td.h{font-weight:600}td.rn{background:var(--gs);color:var(--g);text-align:center;font-size:12px;width:28px;font-weight:600}
.fxbar{display:flex;align-items:center;border:2px solid var(--g);border-radius:8px;background:var(--card);margin:8px 0}
.fxbar span{padding:0 10px;color:var(--fx);font:italic 700 15px Georgia,serif;border-right:1px solid var(--line)}
.fxbar input{flex:1;border:0;background:transparent;color:var(--ink);padding:12px;font:500 15px 'JetBrains Mono',monospace;min-width:0;outline:0}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:600 15px inherit;cursor:pointer}.btn.o{background:transparent;color:var(--g);border:1px solid var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap}.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px;margin:6px 0;font:inherit;cursor:pointer}
.ok{color:var(--g);font-weight:600}.no{color:var(--bad);font-weight:600}.res{margin-top:8px;font-size:14px}
.back{background:none;border:0;color:var(--g);font:600 15px inherit;padding:6px 0;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:11px 4px;font:600 13px inherit;cursor:pointer}nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
.pill{display:inline-block;background:var(--gs);color:var(--g);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
svg{max-width:100%}
button:active,.opt:active{transform:scale(.96)}button{transition:transform .08s}
#hud{position:sticky;top:0;z-index:6;display:flex;align-items:center;max-width:560px;margin:0 auto;padding:8px 16px;background:var(--bg);font-size:14px}
#hud button{background:none;border:0;font-size:18px;margin-left:6px;cursor:pointer}
.toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:var(--g);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 8px 24px #0004}
@media (prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style></head><body><main id="app"></main>
<nav><button data-t="home">Chapters</button><button data-t="cheat">Cheat sheet</button><button data-t="lab">Scenarios</button><button data-t="prog">Progress</button></nav>
<script>
const C=[
{id:"basics",ic:"Σ",t:"Basics and references",lv:"Foundation",intro:"Every formula starts with =. Cells are named by column letter and row number (B3). Ranges use a colon (B2:B9).",
fn:[["SUM / AVERAGE","=SUM(range)","Total and mean. Also MIN, MAX, COUNT (numbers only) and COUNTA (non-blank)."],["Cell maths","=B2*C2","Operators + − * / ^. Brackets control order."],["Absolute reference","=D2*$F$1","$ locks a cell so it does not move when you copy the formula down. F4 toggles it."]],
tip:"Pro habit: never type constants like 18% inside formulas. Keep them in an assumptions cell and lock with $.",
P:[{q:"Total of all prices in C2:C5.",tb:[["Item","Qty","Price"],["Pen",10,50],["Book",4,120],["Bag",2,900],["Cap",5,150]],a:["SUM(C2:C5)"],h:"Use the function that adds a range.",e:"=SUM(C2:C5) adds every cell in the range."},
{q:"Revenue in D2 = Qty × Price for row 2.",tb:[["Item","Qty","Price","Revenue"],["Pen",10,50,""]],a:["B2*C2","C2*B2","PRODUCT(B2:C2)"],h:"Multiply two cells.",e:"=B2*C2, then drag down to fill the column."},
{q:"GST rate is in F1 (18%). Write the tax for D2 so it still works when copied down.",tb:[["Item","Qty","Price","Revenue","","Rate"],["Pen",10,50,500,"",0.18]],a:["D2*$F$1","$F$1*D2"],h:"Lock F1 with dollar signs.",e:"=D2*$F$1 — the locked F1 stays fixed while D2 becomes D3, D4, and so on."}]},
{id:"logic",ic:"?",t:"Logical functions",lv:"Core",intro:"Logic lets a sheet decide. IF tests a condition and returns one of two results. Combine tests with AND and OR.",
fn:[["IF","=IF(test, if_true, if_false)","Text results go in double quotes."],["AND / OR","=AND(test1, test2)","AND needs all true, OR needs any true."],["IFS","=IFS(test1,result1,test2,result2,TRUE,default)","Replaces long nested IFs. TRUE as last test works as the else."],["IFERROR","=IFERROR(formula, fallback)","Hides #N/A and #DIV/0! cleanly in reports."]],
tip:"Nested IFs beyond three levels are a maintenance risk. Move to IFS, a lookup table or SWITCH.",
P:[{q:"B2 holds sales. Return Met if sales are at least 50000, otherwise Missed.",tb:[["Rep","Sales","Rating"],["Asha",56000,4.5]],a:[`IF(B2>=50000,"Met","Missed")`],h:"IF(test, yes, no).",e:`=IF(B2>=50000,"Met","Missed")`},
{q:"Bonus is Yes only when sales ≥ 50000 AND rating ≥ 4.",tb:[["Rep","Sales","Rating"],["Asha",56000,4.5]],a:[`IF(AND(B2>=50000,C2>=4),"Yes","No")`],h:"Put AND inside the IF test.",e:"AND returns TRUE only when both tests pass."},
{q:"Grade B2: 90+ = A, 75+ = B, else C. Use IFS and end with TRUE.",tb:[["Student","Score"],["Ravi",82]],a:[`IFS(B2>=90,"A",B2>=75,"B",TRUE,"C")`],h:"Order tests from highest to lowest.",e:"IFS stops at the first true test, so descending order matters."}]},
{id:"lookup",ic:"⌕",t:"Lookup and reference",lv:"Core",intro:"Lookups fetch a value from a table by key. XLOOKUP is the modern standard in Excel 365 and 2021+.",
fn:[["XLOOKUP","=XLOOKUP(find, look_range, return_range, [if_missing])","Looks left or right, exact match by default, built-in not-found text."],["INDEX + MATCH","=INDEX(return_range, MATCH(find, look_range, 0))","Works in every version. 0 means exact match."],["VLOOKUP","=VLOOKUP(find, table, col, FALSE)","Legacy. Looks right only. Always use FALSE for exact."]],
tip:"Lookups fail on stray spaces and text-versus-number mismatches. Clean keys with TRIM and VALUE.",
P:[{q:"E1 holds a product code. Return its price from B2:B6 using codes in A2:A6 (use XLOOKUP).",tb:[["Code","Price","","","Find"],["P01",120],["P02",340],["P03",95],["P04",410],["P05",60,"","","P03"]],a:["XLOOKUP(E1,A2:A6,B2:B6)",`XLOOKUP(E1,A2:A6,B2:B6,"Not found")`],h:"find, look_range, return_range.",e:"=XLOOKUP(E1,A2:A6,B2:B6)"},
{q:"Same task with INDEX and MATCH.",tb:[["Code","Price","","","Find"],["P01",120,"","","P03"],["P02",340],["P03",95]],a:["INDEX(B2:B4,MATCH(E2,A2:A4,0))","INDEX(B2:B6,MATCH(E2,A2:A6,0))"],h:"MATCH finds the position, INDEX returns the value there.",e:"MATCH(E2,A2:A4,0) gives 3; INDEX takes the 3rd item of B2:B4."},
{q:"Which statement is true for XLOOKUP?",mc:["It can only look to the right","It defaults to exact match and can return a custom not-found value","It needs the column index number","It is available in Excel 2010"],c:1,e:"XLOOKUP has no column index, searches either direction and has an if_not_found argument."}]},
{id:"agg",ic:"Σ?",t:"Conditional summary",lv:"Intermediate",intro:"Management reports are mostly totals, counts and averages split by conditions. The -IFS family handles several conditions at once.",
fn:[["SUMIFS","=SUMIFS(sum_range, crit_range1, crit1, ...)","Sum range comes first."],["COUNTIFS","=COUNTIFS(crit_range1, crit1, ...)","Counts rows meeting all conditions. Operators go in quotes: \">1000\"."],["AVERAGEIFS","=AVERAGEIFS(avg_range, crit_range, crit)","Average with conditions."],["SUMPRODUCT","=SUMPRODUCT(range1, range2)","Weighted totals, e.g. qty × price without a helper column."]],
tip:"Ranges in all criteria must be the same size, otherwise you get #VALUE!.",
P:[{q:"Sum sales (C2:C7) where region (A2:A7) is East.",tb:[["Region","Product","Sales"],["East","Tea",1200],["West","Tea",800],["East","Coffee",2100],["North","Tea",640],["East","Tea",950],["West","Coffee",1500]],a:[`SUMIFS(C2:C7,A2:A7,"East")`],h:"Sum range first.",e:`=SUMIFS(C2:C7,A2:A7,"East")`},
{q:"Count East rows with sales above 1000.",tb:[["Region","Product","Sales"],["East","Tea",1200],["West","Tea",800],["East","Coffee",2100],["North","Tea",640],["East","Tea",950],["West","Coffee",1500]],a:[`COUNTIFS(A2:A7,"East",C2:C7,">1000")`],h:"Two range/criteria pairs.",e:"Both conditions must be true on the same row."},
{q:"Total revenue where Qty is B2:B4 and Price is C2:C4, in one cell, no helper column.",tb:[["Item","Qty","Price"],["A",10,50],["B",4,120],["C",2,900]],a:["SUMPRODUCT(B2:B4,C2:C4)"],h:"Multiplies pairs then adds.",e:"10×50 + 4×120 + 2×900 = 2780."}]},
{id:"text",ic:"Aa",t:"Text and dates",lv:"Intermediate",intro:"Real data is messy. Text and date functions clean, split and schedule it.",
fn:[["LEFT / RIGHT / MID","=LEFT(text, n)","Extract characters."],["FIND + LEN","=FIND(\" \", A2)","Position of a character, used to split names."],["TEXTJOIN","=TEXTJOIN(\", \",TRUE,range)","Join with a delimiter and skip blanks."],["TEXTSPLIT","=TEXTSPLIT(A2,\" \")","Split into columns (365)."],["EOMONTH","=EOMONTH(date, 0)","Month end. Use 1 for next month."],["NETWORKDAYS","=NETWORKDAYS(start,end,[holidays])","Working days between dates."],["DATEDIF","=DATEDIF(start,end,\"Y\")","Years, months or days completed."]],
tip:"Dates are serial numbers. If a date looks like 45231, only the cell format is wrong.",
P:[{q:"A2 holds a full name. Return the first name only.",tb:[["Name"],["Priya Sharma"]],a:[`LEFT(A2,FIND(" ",A2)-1)`],h:"LEFT with FIND minus 1.",e:"FIND returns 6, so take 5 characters."},
{q:"B2 has an invoice date. Return the last day of that month.",tb:[["Invoice","Date"],["INV-9",""]],a:["EOMONTH(B2,0)"],h:"Offset 0 means same month.",e:"EOMONTH(date, 0)."},
{q:"Working days between start B2 and end C2.",tb:[["Task","Start","End"],["Audit","01-Nov","29-Nov"]],a:["NETWORKDAYS(B2,C2)"],h:"Skips Saturday and Sunday.",e:"Add a holiday range as a third argument."}]},
{id:"modern",ic:"[ ]",t:"Dynamic arrays (365)",lv:"Advanced",intro:"One formula can now return many results that spill into neighbouring cells. This replaces many old helper-column tricks.",
fn:[["FILTER","=FILTER(array, include, [if_empty])","Return rows that meet a condition."],["SORT / SORTBY","=SORT(array, col, -1)","Sort live. -1 is descending."],["UNIQUE","=UNIQUE(range)","Distinct list that updates itself."],["LET","=LET(name, value, calc)","Name intermediate results. Faster and readable."],["XMATCH, TAKE, VSTACK","=VSTACK(r1, r2)","Stack ranges, take first n rows."]],
tip:"If you see #SPILL!, something is blocking the spill area. Clear the cells beneath the formula.",
P:[{q:"Return all rows (A2:C7) where region in A2:A7 is East.",tb:[["Region","Product","Sales"],["East","Tea",1200],["West","Tea",800],["East","Coffee",2100],["North","Tea",640],["East","Tea",950],["West","Coffee",1500]],a:[`FILTER(A2:C7,A2:A7="East")`],h:"array, then the include test.",e:"The result spills 3 rows automatically."},
{q:"Get a distinct list of regions from A2:A7.",tb:[["Region"],["East"],["West"],["East"],["North"],["East"],["West"]],a:["UNIQUE(A2:A7)"],h:"One function.",e:"Pair with SUMIFS to build a live summary table."},
{q:"Sort A2:C7 by sales (3rd column) largest first.",tb:[["Region","Product","Sales"],["East","Tea",1200],["West","Tea",800]],a:["SORT(A2:C7,3,-1)"],h:"array, column index, order.",e:"-1 means descending."}]},
{id:"mgr",ic:"₹",t:"Manager scenarios",lv:"Professional",intro:"Variance, growth, margin and finance. These are the formulas behind budget reviews, forecasts and business cases.",
fn:[["Variance %","=(Actual-Budget)/Budget","Positive means above budget."],["Growth and CAGR","=(End/Start)^(1/Years)-1","Compound annual growth rate."],["PMT","=PMT(rate/12, years*12, -loan)","Monthly loan instalment."],["NPV / IRR","=NPV(rate, flows)+initial","NPV does not include time-0 cash flow. IRR gives the return rate."],["Margin","=(Revenue-Cost)/Revenue","Margin is on revenue, markup is on cost."]],
tip:"Always wrap division in IFERROR or IF(denominator=0,…) in reports that go to leadership.",
P:[{q:"Variance % of actual B2 against budget C2.",tb:[["Dept","Actual","Budget"],["Sales",118000,100000]],a:["(B2-C2)/C2"],h:"Difference divided by the base.",e:"Base is the budget, so divide by C2."},
{q:"CAGR where start value is B2, end value is C2 and years are D2.",tb:[["","Start","End","Years"],["Revenue",200,350,4]],a:["(C2/B2)^(1/D2)-1"],h:"Ratio to the power of 1/years, minus 1.",e:"≈ 15% a year."},
{q:"Monthly loan payment: annual rate B1, years B2, loan amount B3. Show payment as positive.",tb:[["Rate",0.08],["Years",5],["Loan",500000]],a:["PMT(B1/12,B2*12,-B3)"],h:"Convert rate and years to months. Negative loan gives a positive result.",e:"Rate/12 and years×12 keep units consistent."},
{q:"Gross margin % with revenue in B2 and cost in C2; show 0 if revenue is 0.",tb:[["Item","Revenue","Cost"],["X",80000,52000]],a:["IF(B2=0,0,(B2-C2)/B2)","IFERROR((B2-C2)/B2,0)"],h:"Guard the division.",e:"Protects the report from #DIV/0!."}]},
{id:"viz",ic:"▥",t:"Charts, pivots and interface",lv:"Professional",intro:"Pick the chart for the message, summarise with PivotTables and know the ribbon shortcuts that save hours.",
fn:[["Column / Bar","Compare categories","Sort bars. Use bar when labels are long."],["Line","Trend over time","Months or years on the x-axis."],["Pie / Donut","Part of a whole","Max 5 slices, otherwise use bars."],["Scatter","Relationship of two numbers","Spot outliers and correlation."],["Waterfall","Bridge from start to end","Great for variance and P&L walks."],["PivotTable","Insert › PivotTable","Drag fields into Rows, Columns, Values, Filters. Add Slicers and Timelines."],["Shortcuts","Ctrl+T, Ctrl+Shift+L, Alt+=","Table, filter toggle, AutoSum. Ctrl+Arrow jumps edges."],["Power Query","Data › Get Data","Repeatable import and cleaning without formulas."]],
tip:"Format the source as a Table (Ctrl+T) so charts and pivots grow automatically.",
svg:1,
P:[{q:"Best chart for monthly revenue over 12 months?",mc:["Pie","Line","Scatter","Waterfall"],c:1,e:"Lines show direction over ordered time."},{q:"You must show how Budget turned into Actual through increases and decreases. Choose:",mc:["Waterfall","Donut","Line","Radar"],c:0,e:"Waterfall shows each step of change."},{q:"Which pivot area holds the numbers being summed?",mc:["Rows","Filters","Values","Columns"],c:2,e:"Values is where Sum, Count and Average are applied."},{q:"Your data keeps growing monthly. Best way to keep a chart in sync?",mc:["Re-select data every month","Convert data to a Table","Use merged cells","Paste values"],c:1,e:"Tables expand automatically and charts follow."}]}
];
const S=JSON.parse((()=>{try{return localStorage.getItem("xlm")}catch(e){return null}})()||'{"d":{}}');
const save=()=>{try{localStorage.setItem("xlm",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$("#app");
const norm=s=>s.replace(/\s/g,"").replace(/\$/g,"").replace(/^=/,"").toUpperCase();
const cl=i=>String.fromCharCode(65+i);
const done=(c,i)=>S.d[c.id+i],cnt=c=>c.P.filter((_,i)=>done(c,i)).length;
let tab="home";
function nav(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));if(t=="home")home();if(t=="cheat")cheat();if(t=="prog")prog();if(t=="lab")lab();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.t));
const total=()=>C.reduce((a,c)=>a+c.P.length,0),dn=()=>C.reduce((a,c)=>a+cnt(c),0);
function home(){app.innerHTML=`<h1>Excel Mastery</h1><p class="mut">From first formula to manager-level models. Learn a chapter, then practise real scenarios.</p>
<div class="hero"><b>${dn()} of ${total()} problems solved</b><div class="bar" style="background:#ffffff44"><i style="width:${dn()/total()*100}%;background:#fff"></i></div><div class="mut" style="margin-top:6px">Type formulas in the formula bar, exactly as you would in Excel.</div></div>`+
C.map((c,i)=>`<button class="card ch" data-i="${i}"><div class="ic">${c.ic}</div><div style="flex:1"><b>${c.t}</b> <span class="pill">${c.lv}</span><div class="mut">${cnt(c)}/${c.P.length} solved</div><div class="bar"><i style="width:${cnt(c)/c.P.length*100}%"></i></div></div></button>`).join("");
app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>chapter(+b.dataset.i))}
const chart=`<svg viewBox="0 0 320 90" role="img" aria-label="Column, line and pie chart icons"><g fill="none" stroke="var(--g)" stroke-width="3"><path d="M20 80V20M20 80H100"/><rect x="30" y="50" width="12" height="30" fill="var(--g)"/><rect x="50" y="35" width="12" height="45" fill="var(--g)"/><rect x="70" y="20" width="12" height="60" fill="var(--g)"/><path d="M130 70L160 40L185 58L215 20"/><circle cx="270" cy="50" r="30"/><path d="M270 50V20M270 50L296 65" /></g><g fill="var(--mut)" font-size="11"><text x="28" y="90">Compare</text><text x="148" y="90">Trend</text><text x="248" y="90">Share</text></g></svg>`;
function chapter(i){const c=C[i];app.innerHTML=`<button class="back" id="b">‹ All chapters</button><h2>${c.t}</h2><p>${c.intro}</p>${c.svg?chart:""}
${c.fn.map(f=>`<div class="fn"><b>${f[0]}</b><code class="syn">${f[1].replace(/</g,"&lt;")}</code><span class="mut">${f[2]}</span></div>`).join("")}<div class="tip"><b>Pro tip.</b> ${c.tip}</div>
<h3>Practice scenarios</h3><div id="ps"></div>`;$("#b").onclick=()=>nav("home");
c.P.forEach((p,k)=>{const el=document.createElement("div");el.className="card";let h=`<b>${k+1}. ${p.q}</b> ${done(c,k)?'<span class="ok">✓</span>':""}`;
if(p.tb){h+=`<div class="sheet"><table><tr><th></th>${p.tb[0].map((_,j)=>`<th>${cl(j)}</th>`).join("")}</tr>${p.tb.map((r,ri)=>`<tr><td class="rn">${ri+1}</td>${r.map(v=>`<td class="${ri==0?"h":""}">${v}</td>`).join("")}</tr>`).join("")}</table></div><div class="fxbar"><span>fx</span><input autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="=type formula"></div><div class="row"><button class="btn">Check</button><button class="btn o hint">Hint</button></div><div class="res"></div>`;}
else h+=p.mc.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join("")+'<div class="res"></div>';
el.innerHTML=h;$("#ps").appendChild(el);const res=el.querySelector(".res");
const win=()=>{S.d[c.id+k]=1;save()};
if(p.tb){const inp=el.querySelector("input");el.querySelector(".btn").onclick=()=>{const v=norm(inp.value);if(!v){res.innerHTML='<span class="no">Type a formula first.</span>';return}
if(p.a.map(norm).includes(v)){win();res.innerHTML=`<span class="ok">Correct.</span> ${p.e}`}else res.innerHTML='<span class="no">Not quite.</span> Check ranges, brackets and commas, or tap Hint.'};
